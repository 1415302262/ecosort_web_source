# Canonical online runtime mapping for the audited V6 14-class cascade.

ecosort_config:
  routing_strategy: confidence_only
  confidence_threshold: 0.85
  image_size: 224
  fallback_class: local_prediction

  # Order must match the audited champion checkpoint exactly.
  train_classes:
    - brick_ceramic
    - e_waste
    - foam
    - glass
    - haz_battery
    - haz_device
    - haz_medicine
    - hygiene_contaminated
    - metal
    - organic_food
    - paper_family
    - plastic
    - small_hard_items
    - textile

  # Existing 42-class VLM prompt -> audited V6 taxonomy.
  # `trash` is deliberately omitted: it is an open-set failure and retains
  # the local prediction.
  raw_to_target:
    cardboard: paper_family
    paper: paper_family
    cup: plastic
    plastic: plastic
    plastic_toy: plastic
    plastic_bag: plastic
    chemical: plastic
    paint: plastic
    cosmetic: plastic
    glass: glass
    metal: metal
    clothes: textile
    shoes: textile
    towel: textile
    bag: textile
    e_waste: e_waste
    bone: organic_food
    cake: organic_food
    egg_shell: organic_food
    flower: organic_food
    fruit_peel: organic_food
    leftover: organic_food
    tea: organic_food
    vegetable: organic_food
    battery: haz_battery
    bulb: haz_device
    thermometer: haz_device
    medicine: haz_medicine
    lighter: haz_medicine
    cigarette: hygiene_contaminated
    mask: hygiene_contaminated
    diaper: hygiene_contaminated
    tissue: hygiene_contaminated
    wet_wipe: hygiene_contaminated
    chopsticks: small_hard_items
    pen: small_hard_items
    toothpick: small_hard_items
    comb: small_hard_items
    foam: foam
    brick: brick_ceramic
    ceramic: brick_ceramic
