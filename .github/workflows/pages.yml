name: deploy-portfolio-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/portfolio/**"
      - "reports/ecosort_experiment_report.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp -R docs/portfolio/. _site/
          cp reports/ecosort_experiment_report.pdf _site/ecosort_experiment_report.pdf
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
