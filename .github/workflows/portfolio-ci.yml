name: portfolio-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-network-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: pip install -r requirements-ci.txt
      - name: Compile experiment scripts
        run: |
          python -m py_compile \
            scripts/run_ecosort_vlm_fallback.py \
            scripts/run_ecosort_seed_vlm_fallback.py \
            scripts/analyze_ecosort_vlm_cascade.py \
            scripts/analyze_ecosort_cascade_robustness.py \
            scripts/plot_ecosort_cascade_portfolio.py
      - name: Run no-network Seed adapter tests
        run: pytest -q tests/test_seed_vlm_unit.py
