# TrashNet到42类的映射（仅6类有对应关系）
trashnet_to_42class:
  cardboard: cardboard
  glass: glass
  metal: metal
  paper: paper
  plastic: plastic
  trash: trash

# 颜色敏感类别（需要控制颜色增强强度）
color_sensitive_classes:
  - glass
  - plastic
  - plastic_toy
  - bottle

# 纹理敏感类别（需要保留细节）
texture_sensitive_classes:
  - paper
  - cardboard
  - fabric
  - textile

# 易混淆类别组（用于困难样本挖掘）
confusable_groups:
  transparent_items:
    - glass
    - plastic
    - plastic_toy
  paper_items:
    - paper
    - cardboard
    - tissue
  food_waste:
    - fruit_peel
    - vegetable
    - leftover
    - cake
